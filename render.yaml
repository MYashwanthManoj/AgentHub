services:
  # ─── Backend: FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: agenthub-api
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://agenthub-ui.onrender.com
      - key: ALGOD_URL
        value: https://testnet-api.algonode.cloud
      - key: ALGOD_TOKEN
        value: ""
      - key: INDEXER_URL
        value: https://testnet-idx.algonode.cloud
      - key: INDEXER_TOKEN
        value: ""
      - key: SELLER_ADDRESS
        value: LRJPYUELQTWYEDWVHZD5PAR7EZ7LPLWEXOSHOCZZNJX3Z4FQY5T2QOFYNY
      - key: SELLER_MNEMONIC
        sync: false   # set this manually in Render dashboard (secret)

  # ─── Frontend: React/Vite Static Site ──────────────────────────────────────
  - type: web
    name: agenthub-ui
    runtime: static
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://agenthub-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
